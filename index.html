<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090a14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Turn music into a colourful live light show using your iPhone microphone." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%230d1022'/%3E%3Ccircle cx='64' cy='64' r='43' fill='%23ff4ad8' opacity='.55'/%3E%3Ccircle cx='64' cy='64' r='25' fill='%234de8ff'/%3E%3Ccircle cx='64' cy='64' r='9' fill='white'/%3E%3C/svg%3E" />
  <title>LUMA — Music Reactive Lights</title>
  <style>
    :root { color-scheme: dark; --fg: #f5f4ff; --muted: #aaa9c7; --panel: rgba(18,19,35,.79); --line: rgba(255,255,255,.13); --accent: #e970eb; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #070813; }
    body { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); -webkit-tap-highlight-color: transparent; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    #lightCanvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; touch-action: manipulation; }
    #veil { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 53%, transparent 20%, rgba(1,2,9,.3) 100%); }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; pointer-events: none; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    .topbar, .bottom { pointer-events: auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .mark { width: 35px; height: 35px; border-radius: 12px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.24); background: linear-gradient(135deg,#ee5dcd,#767af5 55%,#52deff); }
    .mark svg { width: 22px; height: 22px; }
    .brand strong { display: block; font-size: 16px; font-weight: 850; letter-spacing: .22em; line-height: 1.1; }
    .brand small { display: block; white-space: nowrap; margin-top: 4px; font-size: 10px; font-weight: 600; letter-spacing: .14em; color: #cdcce0; }
    .topactions { display: flex; align-items: center; gap: 8px; }
    .status { display: inline-flex; flex-shrink: 0; white-space: nowrap; align-items: center; gap: 7px; border: 1px solid var(--line); background: rgba(12,13,28,.57); border-radius: 100px; font-size: 11px; color: #e7e7f5; padding: 10px 12px; backdrop-filter: blur(12px); }
    .dot { width: 7px; height: 7px; background: #8b8aa4; border-radius: 50%; }
    .dot.active { background: #5af7ac; box-shadow: 0 0 10px #5af7ac; }
    .mini-btn { flex-shrink: 0; white-space: nowrap; border: 1px solid var(--line); color: #fff; background: rgba(12,13,28,.57); border-radius: 100px; min-height: 36px; padding: 0 12px; font-weight: 650; font-size: 12px; backdrop-filter: blur(12px); }
    .centerpiece { margin: auto; align-self: center; width: min(440px, 100%); text-align: center; text-shadow: 0 2px 20px rgba(0,0,0,.35); transition: opacity .3s; }
    .eyebrow { letter-spacing: .27em; font-size: 10px; font-weight: 750; color: #d9d6ea; }
    h1 { font-size: clamp(35px, 10vw, 65px); letter-spacing: -.055em; line-height: 1.04; margin: 12px 0 10px; font-weight: 850; }
    h1 em { font-style: normal; background: linear-gradient(100deg, #fff, #efa6f7 55%, #a9f3ff); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .centerpiece p { color: #e5e0f5; margin: 0 auto; font-size: 14px; line-height: 1.55; max-width: 320px; }
    .centerpiece.running { opacity: 0; pointer-events: none; }
    .bottom { width: min(620px, 100%); margin: 0 auto; border: 1px solid rgba(255,255,255,.16); border-radius: 24px; padding: 16px; background: var(--panel); backdrop-filter: blur(28px) saturate(125%); -webkit-backdrop-filter: blur(28px) saturate(125%); box-shadow: 0 16px 60px rgba(0,0,0,.28); }
    .sourceRow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .primary-btn, .secondary-btn { border-radius: 13px; border: 1px solid rgba(255,255,255,.16); min-height: 47px; padding: 10px 8px; font-size: 12px; font-weight: 780; color: #fff; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .primary-btn { background: linear-gradient(105deg,#c84bcd,#7d58e8); box-shadow: 0 3px 18px rgba(172,74,239,.18); border-color: transparent; }
    .primary-btn.on { background: linear-gradient(110deg,#8930b7,#bd3886); }
    .secondary-btn { background: rgba(255,255,255,.07); }
    .secondary-btn.on { border-color: rgba(155,250,253,.8); background: rgba(69,203,234,.17); }
    .sourceRow svg { width: 16px; height: 16px; flex: 0 0 auto; }
    .info { display: flex; justify-content: space-between; align-items: center; margin: 13px 1px 10px; gap: 12px; min-height: 17px; }
    #message { font-size: 11px; color: #c7c5d9; line-height: 1.35; }
    #message.error { color: #ffb0b3; }
    #level { width: 58px; display: flex; gap: 3px; height: 13px; align-items: end; justify-content: flex-end; flex-shrink: 0; }
    #level span { display: block; width: 6px; height: 100%; border-radius: 2px; background: rgba(255,255,255,.15); }
    #level span.lit { background: linear-gradient(to top, #a45af5, #68eaff); }
    .divider { border: 0; border-top: 1px solid rgba(255,255,255,.11); margin: 11px 0 15px; }
    .sectionTitle { font-size: 10px; letter-spacing: .15em; color: #a9a6c3; text-transform: uppercase; font-weight: 800; margin-bottom: 10px; }
    .modeGrid { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; }
    .mode { background: rgba(255,255,255,.055); color: #d1d0e3; border: 1px solid transparent; border-radius: 10px; min-height: 37px; font-size: 11px; font-weight: 750; }
    .mode.selected { background: rgba(195,104,245,.18); border-color: rgba(225,137,249,.7); color: #fff; }
    .controlsLine { display: flex; justify-content: space-between; gap: 14px; margin: 16px 0 11px; align-items: center; }
    .paletteRow { display: flex; align-items: center; gap: 9px; }
    .palette-btn { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); padding: 0; }
    .palette-btn.selected { outline: 2px solid white; outline-offset: 2px; }
    .palette-btn[data-palette="neon"] { background: conic-gradient(#f353d0,#47f7fa,#f7ca59,#f353d0); }
    .palette-btn[data-palette="sunset"] { background: conic-gradient(#fc5067,#fa9c37,#f8cf63,#fc5067); }
    .palette-btn[data-palette="ocean"] { background: conic-gradient(#40cdf6,#5a72ee,#29dcbe,#40cdf6); }
    .palette-btn[data-palette="forest"] { background: conic-gradient(#6cef83,#13aaa4,#dedf54,#6cef83); }
    .palette-btn[data-palette="mono"] { background: conic-gradient(#fff,#8693ad,#eee,#fff); }
    #trackName { color: #b7b3ca; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; min-width: 0; max-width: 145px; }
    .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
    .sliderLabel { display: flex; justify-content: space-between; gap: 5px; font-size: 11px; color: #d5d2e6; font-weight: 650; margin-bottom: 9px; }
    .sliderLabel output { color: #b0a9c4; font-variant-numeric: tabular-nums; }
    input[type=range] { appearance: none; -webkit-appearance: none; width: 100%; height: 5px; border-radius: 10px; background: rgba(255,255,255,.17); margin: 4px 0 5px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #f4e8ff; border: 3px solid #b965e7; box-shadow: 0 1px 8px #0005; }
    input[type=range]::-moz-range-thumb { height: 12px; width: 12px; border-radius: 50%; background: #f4e8ff; border: 3px solid #b965e7; }
    .footnote { margin-top: 14px; color: #8f8ca7; font-size: 10px; line-height: 1.35; text-align: center; }
    #restore { display: none; pointer-events: auto; position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); padding: 11px 15px; font-size: 12px; color: #fff; font-weight: 750; border: 1px solid rgba(255,255,255,.3); background: rgba(10,12,28,.38); backdrop-filter: blur(10px); border-radius: 100px; }
    body.light-only #app > .topbar, body.light-only .bottom, body.light-only .centerpiece { display: none; }
    body.light-only #restore { display: block; }
    #file { display: none; }
    @media(max-height: 730px) { .bottom { padding: 12px; border-radius: 19px; } .centerpiece h1 { font-size: 37px; } .centerpiece p { font-size: 12px; } .controlsLine { margin: 12px 0 7px; } .sliders { margin-top: 9px; } .footnote { margin-top: 10px; } .divider { margin: 9px 0 11px; } }
    @media(max-height: 625px) { .centerpiece { display:none; } .bottom { max-width: 690px; } .footnote { display:none; } }
    @media(max-width: 355px) { .status { display:none; } .bottom { padding:12px; } .sourceRow { gap:5px; } .primary-btn,.secondary-btn { font-size:11px; } .paletteRow { gap:6px; } }
    @media(prefers-reduced-motion: reduce) { .centerpiece { transition: none; } }
  </style>
</head>
<body>
  <canvas id="lightCanvas" aria-label="Audio reactive full screen light visualizer"></canvas>
  <div id="veil"></div>
  <main id="app">
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 13h3l2-7 4 12 3-9 2 4h4" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span><strong>LUMA</strong><small>MUSIC TO LIGHT</small></span>
      </div>
      <div class="topactions">
        <span class="status" aria-live="polite"><span class="dot" id="statusDot"></span><span id="statusText">Standby</span></span>
        <button class="mini-btn" id="lightsOnly">Lights only ↗</button>
      </div>
    </header>
    <section class="centerpiece" id="centerpiece" aria-hidden="false">
      <div class="eyebrow">FEEL EVERY BEAT</div>
      <h1>Make sound<br/><em>shine.</em></h1>
      <p>Turn your iPhone screen into a living light show that moves with your music.</p>
    </section>
    <section class="bottom" aria-label="Music light controls">
      <div class="sourceRow">
        <button class="primary-btn" id="micBtn"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" stroke-width="2"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="micLabel">Use mic</span></button>
        <button class="secondary-btn" id="fileBtn"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm11-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span id="fileLabel">Play file</span></button>
        <button class="secondary-btn" id="demoBtn"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span id="demoLabel">Try demo</span></button>
      </div>
      <input type="file" id="file" accept="audio/*" aria-label="Choose a music file" />
      <div class="info"><span id="message" role="status">Start the mic and play music near your phone.</span><span id="level" aria-label="Audio level"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span></div>
      <hr class="divider" />
      <div class="sectionTitle">Light effect</div>
      <div class="modeGrid" role="group" aria-label="Light effect">
        <button class="mode selected" data-mode="glow" aria-pressed="true">Glow</button>
        <button class="mode" data-mode="aurora" aria-pressed="false">Aurora</button>
        <button class="mode" data-mode="spectrum" aria-pressed="false">Spectrum</button>
        <button class="mode" data-mode="disco" aria-pressed="false">Disco</button>
      </div>
      <div class="controlsLine"><div class="sectionTitle" style="margin:0">Colour palette</div><div class="paletteRow" role="group" aria-label="Colour palette">
        <button class="palette-btn selected" title="Neon" aria-label="Neon" aria-pressed="true" data-palette="neon"></button>
        <button class="palette-btn" title="Sunset" aria-label="Sunset" aria-pressed="false" data-palette="sunset"></button>
        <button class="palette-btn" title="Ocean" aria-label="Ocean" aria-pressed="false" data-palette="ocean"></button>
        <button class="palette-btn" title="Forest" aria-label="Forest" aria-pressed="false" data-palette="forest"></button>
        <button class="palette-btn" title="White" aria-label="White" aria-pressed="false" data-palette="mono"></button>
      </div></div>
      <div class="sliders">
        <label><div class="sliderLabel"><span>Sensitivity</span><output id="sensValue">1.6×</output></div><input type="range" id="sensitivity" min="0.5" max="3.5" value="1.6" step="0.1" /></label>
        <label><div class="sliderLabel"><span>Light intensity</span><output id="brightValue">85%</output></div><input type="range" id="brightness" min="15" max="100" value="85" step="5" /></label>
      </div>
      <div class="footnote">Mic audio stays on your device • Smooth transitions, no rapid strobing</div>
    </section>
    <button id="restore">Show controls ⚙</button>
  </main>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const canvas = $('lightCanvas');
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      const palettes = { neon: [313, 188, 47], sunset: [347, 25, 46], ocean: [197, 242, 169], forest: [118, 169, 65], mono: [220, 220, 220] };
      const state = { source: 'off', mode: 'glow', palette: 'neon', sensitivity: 1.6, brightness: 0.85,
        energy: 0, bass: 0, mid: 0, high: 0, beat: 0, beatHue: 0, avgBass: 0.12, lastBeat: 0,
        stream: null, micSource: null, fileSource: null, audioContext: null, analyser: null, freq: null,
        timeData: null, objectUrl: null, audio: new Audio(), wakeLock: null, lastDraw: 0, lastUi: 0 };
      state.audio.playsInline = true;
      state.audio.preload = 'metadata';
      let width = 0, height = 0, dpr = 1;
      const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const hsla = (h, s, l, a = 1) => `hsla(${((h % 360) + 360) % 360},${s}%,${l}%,${a})`;
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const setMessage = (value, error = false) => { $('message').textContent = value; $('message').classList.toggle('error', error); };
      function resize() {
        const rect = canvas.getBoundingClientRect(); width = Math.max(1, rect.width); height = Math.max(1, rect.height);
        dpr = Math.min(window.devicePixelRatio || 1, 1.35);
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize); resize();
      const saved = (() => { try { return JSON.parse(localStorage.getItem('luma-prefs') || '{}'); } catch { return {}; } })();
      if (palettes[saved.palette]) state.palette = saved.palette;
      if (['glow','aurora','spectrum','disco'].includes(saved.mode)) state.mode = saved.mode;
      if (Number.isFinite(saved.sensitivity)) state.sensitivity = clamp(saved.sensitivity, .5, 3.5);
      if (Number.isFinite(saved.brightness)) state.brightness = clamp(saved.brightness, .15, 1);
      $('sensitivity').value = state.sensitivity; $('brightness').value = Math.round(state.brightness * 100);
      function savePrefs() { try { localStorage.setItem('luma-prefs', JSON.stringify({ mode: state.mode, palette: state.palette, sensitivity: state.sensitivity, brightness: state.brightness })); } catch {} }
      function syncControls() {
        document.querySelectorAll('[data-mode]').forEach(el => { const on = el.dataset.mode === state.mode; el.classList.toggle('selected', on); el.setAttribute('aria-pressed', String(on)); });
        document.querySelectorAll('[data-palette]').forEach(el => { const on = el.dataset.palette === state.palette; el.classList.toggle('selected', on); el.setAttribute('aria-pressed', String(on)); });
        $('sensValue').textContent = state.sensitivity.toFixed(1) + '×';
        $('brightValue').textContent = Math.round(state.brightness * 100) + '%';
        $('micLabel').textContent = state.source === 'mic' ? 'Stop mic' : 'Use mic';
        $('fileLabel').textContent = state.source === 'file' ? 'Pause file' : (state.audio.src ? 'Play file' : 'Play file');
        $('demoLabel').textContent = state.source === 'demo' ? 'Stop demo' : 'Try demo';
        $('micBtn').classList.toggle('on', state.source === 'mic');
        $('fileBtn').classList.toggle('on', state.source === 'file');
        $('demoBtn').classList.toggle('on', state.source === 'demo');
        $('statusDot').classList.toggle('active', state.source !== 'off');
        $('statusText').textContent = ({ off: 'Standby', mic: 'Mic live', file: 'Playing', demo: 'Demo live' })[state.source];
        $('centerpiece').classList.toggle('running', state.source !== 'off');
      }
      syncControls();
      document.querySelectorAll('[data-mode]').forEach(el => el.addEventListener('click', () => { state.mode = el.dataset.mode; syncControls(); savePrefs(); }));
      document.querySelectorAll('[data-palette]').forEach(el => el.addEventListener('click', () => { state.palette = el.dataset.palette; syncControls(); savePrefs(); }));
      $('sensitivity').addEventListener('input', e => { state.sensitivity = +e.target.value; syncControls(); savePrefs(); });
      $('brightness').addEventListener('input', e => { state.brightness = +e.target.value / 100; syncControls(); savePrefs(); });
      $('lightsOnly').addEventListener('click', () => { document.body.classList.add('light-only'); });
      $('restore').addEventListener('click', () => { document.body.classList.remove('light-only'); });
      async function requestWakeLock() {
        if (!('wakeLock' in navigator) || document.visibilityState !== 'visible' || state.source === 'off' || state.wakeLock) return;
        try { state.wakeLock = await navigator.wakeLock.request('screen'); state.wakeLock.addEventListener('release', () => { state.wakeLock = null; }); } catch {}
      }
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWakeLock(); });
      function releaseWakeLock() { if (state.wakeLock) { state.wakeLock.release().catch(() => {}); state.wakeLock = null; } }
      function ensureContext() {
        if (!state.audioContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) throw new Error('Web Audio is unavailable in this browser. Open in Safari.');
          state.audioContext = new AudioCtx({ latencyHint: 'interactive' });
          state.analyser = state.audioContext.createAnalyser();
          state.analyser.fftSize = 2048;
          state.analyser.smoothingTimeConstant = 0.78;
          state.analyser.minDecibels = -90;
          state.analyser.maxDecibels = -12;
          state.freq = new Uint8Array(state.analyser.frequencyBinCount);
          state.timeData = new Uint8Array(state.analyser.fftSize);
        }
        return state.audioContext.resume();
      }
      function stopSource() {
        if (state.stream) { for (const t of state.stream.getTracks()) t.stop(); state.stream = null; }
        if (state.micSource) { try { state.micSource.disconnect(); } catch {} state.micSource = null; }
        state.audio.pause();
        state.source = 'off';
        releaseWakeLock(); syncControls();
      }
      function activate(source) { state.source = source; requestWakeLock(); syncControls(); }
      $('micBtn').addEventListener('click', async () => {
        if (state.source === 'mic') { stopSource(); setMessage('Microphone stopped.'); return; }
        stopSource();
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setMessage('Mic requires HTTPS. Open the hosted app in Safari.', true); return;
        }
        $('micBtn').disabled = true;
        setMessage('Allow microphone access when Safari asks…');
        try {
          await ensureContext();
          const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, video: false });
          state.stream = stream;
          state.micSource = state.audioContext.createMediaStreamSource(stream);
          state.micSource.connect(state.analyser); // Never route microphone to speakers (avoids feedback).
          activate('mic');
          setMessage('Listening · play music nearby. Sound never leaves this device.');
        } catch (err) {
          stopSource();
          const denied = ['NotAllowedError','PermissionDeniedError','SecurityError'].includes(err.name);
          setMessage(denied ? 'Microphone blocked. Allow access in Safari settings and try again.' : (err.message || 'Could not access the microphone.'), true);
        } finally { $('micBtn').disabled = false; }
      });
      $('demoBtn').addEventListener('click', () => {
        if (state.source === 'demo') { stopSource(); setMessage('Demo stopped.'); return; }
        stopSource(); activate('demo'); setMessage('Demo mode · animated sample beat, no mic required.');
      });
      $('fileBtn').addEventListener('click', async () => {
        if (state.source === 'file') { stopSource(); setMessage('File paused · tap Play file to resume.'); return; }
        if (!state.audio.src) { $('file').click(); return; }
        await playFile();
      });
      $('file').addEventListener('change', async e => {
        const file = e.target.files && e.target.files[0]; if (!file) return;
        if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
        state.objectUrl = URL.createObjectURL(file);
        state.audio.src = state.objectUrl;
        state.audio.load();
        setMessage('Selected: ' + file.name.slice(0, 65));
        await playFile();
        e.target.value = '';
      });
      async function playFile() {
        stopSource();
        try {
          await ensureContext();
          if (!state.fileSource) {
            state.fileSource = state.audioContext.createMediaElementSource(state.audio);
            state.fileSource.connect(state.analyser);
            state.analyser.connect(state.audioContext.destination); // File playback is audible.
          }
          await state.audio.play();
          activate('file');
          setMessage('Playing on this iPhone · ' + (state.audio.src ? 'lights follow the file' : 'file ready'));
        } catch (err) { stopSource(); setMessage('Unable to play this audio file. Try MP3, AAC or WAV.', true); }
      }
      state.audio.addEventListener('ended', () => { stopSource(); setMessage('Track finished. Choose another file or play again.'); });
      state.audio.addEventListener('error', () => { if (state.audio.src) setMessage('Unsupported audio format. Try an MP3 or AAC file.', true); });
      // No microphone samples are recorded, stored, transmitted, or played back.
      function analyze(t) {
        if (state.source === 'off') {
          state.energy = lerp(state.energy, .045, .055); state.bass = lerp(state.bass, .05, .08);
          state.mid = lerp(state.mid, .05, .06); state.high = lerp(state.high, .04, .06);
          state.beat *= .89; return;
        }
        if (state.source === 'demo') {
          const phase = t / 545; // about 110 BPM
          const thump = Math.exp(-Math.pow(((phase % 1) * 5), 2));
          const triplet = Math.pow(Math.max(0, Math.sin(t / 163)), 8);
          const bass = clamp(.2 + thump * .8 + .09 * Math.sin(t / 1200));
          state.bass = lerp(state.bass, bass, .28);
          state.mid = lerp(state.mid, clamp(.18 + triplet * .5 + thump * .25), .24);
          state.high = lerp(state.high, clamp(.18 + Math.pow(Math.max(0, Math.cos(t / 210)), 7) * .55), .20);
          state.energy = lerp(state.energy, clamp(.16 + .55 * state.bass + .2 * state.mid), .3);
          if (thump > .92 && t - state.lastBeat > 390) { state.beat = 1; state.lastBeat = t; state.beatHue++; }
        } else if (state.analyser && state.audioContext && state.audioContext.state === 'running') {
          state.analyser.getByteFrequencyData(state.freq);
          state.analyser.getByteTimeDomainData(state.timeData);
          const binHz = state.audioContext.sampleRate / state.analyser.fftSize;
          const band = (lo, hi) => {
            const start = Math.max(1, Math.floor(lo / binHz));
            const end = Math.min(state.freq.length - 1, Math.ceil(hi / binHz));
            let sum = 0, n = 0;
            for (let i = start; i <= end; i++) { sum += state.freq[i] / 255; n++; }
            return n ? sum / n : 0;
          };
          const rawBass = band(48, 220), rawMid = band(220, 2200), rawHigh = band(2200, 8500);
          let square = 0;
          for (let i = 0; i < state.timeData.length; i += 4) { const x = (state.timeData[i] - 128) / 128; square += x * x; }
          const rms = Math.sqrt(square / (state.timeData.length / 4));
          // Quiet rooms stay dim; adaptive scaling makes various speaker levels usable.
          const scale = state.sensitivity;
          const bass = clamp(Math.max(0, rawBass - .045) * scale * 2.25);
          const mid = clamp(Math.max(0, rawMid - .045) * scale * 2.2);
          const high = clamp(Math.max(0, rawHigh - .04) * scale * 2.5);
          const loudness = clamp(Math.max(bass * .58 + mid * .3 + high * .12, rms * scale * 3.0));
          const follow = (old, next) => lerp(old, next, next > old ? .29 : .10);
          state.bass = follow(state.bass, bass);
          state.mid = follow(state.mid, mid);
          state.high = follow(state.high, high);
          state.energy = follow(state.energy, loudness);
          state.avgBass = lerp(state.avgBass, bass, .016);
          if (bass > Math.max(.25, state.avgBass * 1.42) && bass > state.bass * .92 && t - state.lastBeat > 425) {
            state.beat = .9; state.lastBeat = t; state.beatHue++;
          }
        }
        state.beat *= reducedMotion ? .70 : .84;
      }
      function orb(x, y, radius, hue, alpha, lightness = 57, sat = 95) {
        if (alpha < .004 || radius < 1) return;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
        grad.addColorStop(0, hsla(hue, sat, lightness + 12, alpha));
        grad.addColorStop(.28, hsla(hue, sat, lightness, alpha * .66));
        grad.addColorStop(.68, hsla(hue, sat, Math.max(22, lightness - 20), alpha * .23));
        grad.addColorStop(1, hsla(hue, sat, 23, 0));
        ctx.fillStyle = grad; ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
      }
      function draw(timestamp) {
        requestAnimationFrame(draw);
        if (timestamp - state.lastDraw < 30) return;
        const delta = Math.min(64, timestamp - (state.lastDraw || timestamp)); state.lastDraw = timestamp;
        analyze(timestamp);
        const p = palettes[state.palette], mono = state.palette === 'mono';
        const motion = reducedMotion ? .28 : 1;
        const level = clamp(state.energy), bass = clamp(state.bass), mid = clamp(state.mid), high = clamp(state.high), beat = clamp(state.beat);
        const bright = state.brightness;
        const baseHue = p[0] + (state.mode === 'disco' ? state.beatHue * 13 : Math.sin(timestamp / 8500) * 8) * motion;
        const light = 4 + (8 + level * 20) * bright;
        const base = ctx.createLinearGradient(0, 0, width, height);
        base.addColorStop(0, hsla(baseHue, mono ? 8 : 60, light));
        base.addColorStop(.6, hsla(p[1], mono ? 8 : 65, light * .45));
        base.addColorStop(1, hsla(p[2], mono ? 8 : 66, light * .9));
        ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = base; ctx.fillRect(0, 0, width, height);
        ctx.globalCompositeOperation = 'screen';
        const dimension = Math.max(width, height);
        const intensity = bright * (.09 + level * .72 + beat * .15);
        if (state.mode === 'glow') {
          orb(width * .50, height * .52, dimension * (.57 + bass * .10), baseHue, clamp(intensity * 1.65), 58 + bass * 8, mono ? 0 : 94);
          orb(width * (.18 + Math.sin(timestamp / 3300) * .1 * motion), height * .35, dimension * .42, p[1], clamp(intensity * .8), 52, mono ? 0 : 90);
          orb(width * .85, height * (.67 + Math.cos(timestamp / 3000) * .09 * motion), dimension * .43, p[2], clamp(intensity), 55, mono ? 0 : 93);
        } else if (state.mode === 'aurora') {
          for (let i = 0; i < 5; i++) {
            const x = width * (.09 + .20 * i + Math.sin(timestamp / (2400 + i * 440) + i * 2) * .15 * motion);
            const y = height * (.3 + Math.cos(timestamp / (2600 + i * 550) + i) * .21 * motion);
            orb(x, y, dimension * (.32 + bass * .17), p[i % 3] + Math.sin(timestamp / 5000 + i) * 14 * motion, clamp(intensity * (.66 + i * .08)), 58 + 8 * mid, mono ? 0 : 92);
          }
          orb(width * .50, height * .88, dimension * .4, p[1], clamp(intensity * .95), 63, mono ? 0 : 90);
        } else if (state.mode === 'spectrum') {
          orb(width * .5, height * .5, dimension * .63, p[0], clamp(intensity * .85), 57, mono ? 0 : 90);
          orb(width * .25, height * .75, dimension * .5, p[1], clamp(intensity * .67), 54, mono ? 0 : 92);
          orb(width * .80, height * .20, dimension * .48, p[2], clamp(intensity * .69), 55, mono ? 0 : 94);
          const bars = 35, gap = Math.max(3, width * .006), barWidth = Math.max(2, (width * .88 - gap * (bars - 1)) / bars);
          for (let i = 0; i < bars; i++) {
            let amp;
            if (state.source === 'mic' || state.source === 'file') {
              const idx = Math.min(state.freq.length - 1, Math.round(2 * Math.pow(state.freq.length / 2 / 2, i / (bars - 1))));
              amp = clamp((state.freq[idx] / 255 - .03) * state.sensitivity * 1.7);
            } else amp = clamp(level * (.35 + .65 * Math.abs(Math.sin(i * .47 + timestamp / 350))) + bass * .19);
            const h = 8 + amp * Math.min(height * .30, 240);
            const x = width * .06 + i * (barWidth + gap);
            const y = height * .52 - h * .5;
            const color = p[Math.floor(i / bars * 3) % 3];
            ctx.fillStyle = hsla(color, mono ? 0 : 94, 72, clamp(.19 + intensity * .68));
            ctx.beginPath(); ctx.roundRect(x, y, barWidth, h, Math.min(barWidth / 2, 6)); ctx.fill();
          }
        } else if (state.mode === 'disco') {
          const gridCols = width > 600 ? 6 : 4, gridRows = 7;
          const w = width / gridCols, h = height / gridRows;
          for (let row = 0; row < gridRows; row++) for (let col = 0; col < gridCols; col++) {
            const phase = (col * 5 + row * 3 + state.beatHue) % 3;
            const lum = (17 + (level * 35 + (phase === 0 ? bass : phase === 1 ? mid : high) * 18) * bright);
            const hue = p[phase] + (state.beatHue * 2 + (col + row) * 4) * motion;
            ctx.fillStyle = hsla(hue, mono ? 0 : 87, lum, .36 + intensity * .22);
            ctx.fillRect(col * w + 2, row * h + 2, w - 4, h - 4);
          }
          orb(width * .5, height * .45, dimension * .65, p[state.beatHue % 3], clamp(intensity * .9), 58, mono ? 0 : 94);
        }
        ctx.globalCompositeOperation = 'source-over';
        if (timestamp - state.lastUi > 120) {
          state.lastUi = timestamp;
          const n = Math.round(level * 7);
          $('level').querySelectorAll('span').forEach((el, i) => el.classList.toggle('lit', i < n));
        }
      }
      requestAnimationFrame(draw);
      window.addEventListener('pagehide', () => { if (state.stream) state.stream.getTracks().forEach(t => t.stop()); releaseWakeLock(); });
    })();
  </script>
